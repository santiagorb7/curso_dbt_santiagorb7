version: 2

sources:
  - name: sql_server_dbo
    database: "{{ env_var('DBT_BRONZE_DB') }}"
    schema: sql_server_dbo
    tables:
      - name: addresses
        description: Direcciones de usuarios y pedidos.
        columns:
          - name: address_id
            data_type: varchar
            description: "Identificador único de la dirección."
            data_tests:
              - not_null
          - name: address
            data_type: varchar
            description: "Calle y número."
          - name: zipcode
            data_type: number
            description: "Código postal."
          - name: state
            data_type: varchar
            description: "Estado o provincia."
          - name: country
            data_type: varchar
            description: "País."
          - name: _fivetran_deleted
            data_type: boolean
            description: "Borrado lógico marcado por Fivetran."
          - name: _fivetran_synced
            data_type: timestamp_tz
            description: "Momento de la última sincronización de Fivetran."
      - name: events
        columns:
          - name: event_id
            data_tests:
              - not_null
      - name: order_items
      - name: orders
        columns:
          - name: order_id
            data_tests:
              - not_null
      - name: products
        columns:
          - name: product_id
            data_tests:
              - not_null
      - name: promos
        columns:
          - name: promo_id
            data_tests:
              - not_null
      - name: users
        columns:
          - name: user_id
            data_tests:
              - not_null
